<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background with rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer glowing calorie flame & food bowl symbol -->
  <g transform="translate(106, 96)">
    <!-- Plate / Bowl arc -->
    <path d="M 30 200 C 30 280 270 280 270 200 Z" fill="#ffffff" opacity="0.95" />
    <ellipse cx="150" cy="200" rx="120" ry="24" fill="#f0fdfa" />
    
    <!-- Organic Flame / Energy Sprout -->
    <path d="M 150 40 C 180 90 220 120 200 170 C 190 190 170 200 150 200 C 130 200 110 190 100 170 C 80 120 120 90 150 40 Z" fill="#f59e0b" />
    <path d="M 150 80 C 165 110 185 130 175 160 C 170 170 160 178 150 178 C 140 178 130 170 125 160 C 115 130 135 110 150 80 Z" fill="#fbbf24" />
    
    <!-- Fresh Leaf -->
    <path d="M 150 120 C 190 100 230 130 220 170 C 180 180 160 150 150 120 Z" fill="url(#leafGrad)" />
  </g>
  
  <!-- Subtitle Text -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">קלוריות</text>
</svg>
